<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'sha256-aQzwbQ607pbdHi8I5GVHhDhDvTsALLM9vuTazEkUP/s='; style-src 'sha256-UlojuTuRTv+gnrzw0iOwbmzDu4hRZpOQg9/fKf+EamY='; connect-src 'self'; img-src blob:; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'">
<title>Memex shared chat</title>
<style>:root {
  color-scheme: dark;
  background: #121416;
  color: #e7e9ec;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #121416;
  color: #e7e9ec;
}

button,
a {
  font: inherit;
}

button {
  color: inherit;
}

.shared-transcript-reader {
  width: min(100% - 2rem, 780px);
  margin: 0 auto;
  padding: 4rem 0 3rem;
}

.shared-transcript-header {
  padding-bottom: 2.5rem;
  border-bottom: 1px solid #30343a;
}

.shared-transcript-header h1 {
  margin: 0;
  color: #f4f5f6;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 650;
  letter-spacing: -0.025em;
  line-height: 1.15;
}

.shared-transcript-intro {
  margin-top: 1.25rem;
  color: #b9bec7;
  font-size: 1.05rem;
}

.shared-transcript-disclosure,
#shared-transcript-status {
  margin: 1.15rem 0 0;
  color: #8e97a4;
  font-size: 0.78rem;
  letter-spacing: 0.045em;
  text-transform: uppercase;
}

.shared-transcript-pages {
  padding-top: 1.25rem;
}

.shared-transcript-page {
  display: grid;
  gap: 1.25rem;
}

.shared-transcript-page + .shared-transcript-page {
  margin-top: 1.25rem;
}

.shared-transcript-message {
  padding: 1.2rem 1.35rem;
  border-radius: 0.9rem;
}

.shared-transcript-message-user {
  background: #1b2731;
  border: 1px solid #263a49;
}

.shared-transcript-message-assistant {
  padding-left: 0;
  padding-right: 0;
}

.shared-transcript-role {
  margin: 0 0 0.55rem;
  color: #8e97a4;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.shared-transcript-message-markdown > :first-child,
.shared-transcript-intro > :first-child {
  margin-top: 0;
}

.shared-transcript-message-markdown > :last-child,
.shared-transcript-intro > :last-child {
  margin-bottom: 0;
}

.shared-transcript-markdown p {
  margin: 0.75rem 0;
}

.shared-transcript-markdown h1,
.shared-transcript-markdown h2,
.shared-transcript-markdown h3,
.shared-transcript-markdown h4 {
  color: #f1f3f5;
  line-height: 1.25;
}

.shared-transcript-markdown pre {
  overflow: auto;
  padding: 0.9rem 1rem;
  border: 1px solid #30343a;
  border-radius: 0.55rem;
  background: #0d0f11;
  color: #e0e5eb;
}

.shared-transcript-markdown code {
  padding: 0.1rem 0.3rem;
  border-radius: 0.25rem;
  background: #252a30;
  color: #f1c58a;
}

.shared-transcript-markdown pre code {
  padding: 0;
  background: transparent;
  color: inherit;
}

.shared-transcript-markdown .chat-inline-code {
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.9em;
}

.shared-transcript-markdown .chat-code-block {
  overflow: hidden;
  margin: 1rem 0;
  border: 1px solid #30343a;
  border-radius: 0.55rem;
  background: #0d0f11;
}

.shared-transcript-markdown .chat-code-label {
  padding: 0.38rem 0.7rem;
  border-bottom: 1px solid #30343a;
  color: #89939f;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.72rem;
}

.shared-transcript-markdown .chat-code-block pre {
  margin: 0;
  padding: 0.9rem 1rem;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.86rem;
  line-height: 1.55;
  white-space: pre-wrap;
}

.chat-json-key {
  color: #8dc7ff;
}

.chat-json-string {
  color: #9ed59e;
}

.chat-json-number {
  color: #e9ad76;
}

.chat-json-boolean {
  color: #c9a7ef;
}

.chat-json-null {
  color: #89939f;
}

.chat-math {
  max-width: 100%;
  color: inherit;
  word-break: normal;
}

.chat-math-inline {
  display: inline-block;
  vertical-align: baseline;
}

.chat-math-display {
  display: block;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 1rem 0;
  padding: 0.25rem 0;
  text-align: center;
}

.chat-math math {
  font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif;
  font-size: 1.05em;
}

.chat-math-display math {
  min-width: max-content;
  margin: 0 auto;
}

.chat-math-error {
  color: #ffb4a8;
  white-space: pre-wrap;
}

.shared-transcript-markdown blockquote {
  margin: 1rem 0;
  padding-left: 1rem;
  border-left: 3px solid #536578;
  color: #b7bec8;
}

.shared-transcript-markdown table {
  width: 100%;
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
}

.shared-transcript-markdown th,
.shared-transcript-markdown td {
  padding: 0.45rem 0.65rem;
  border: 1px solid #3a414a;
  text-align: left;
}

.shared-transcript-link {
  color: #8dc7ff;
  text-decoration: underline;
  text-decoration-color: #547c9f;
  text-underline-offset: 0.16em;
}

.shared-transcript-link:hover,
.shared-transcript-link:focus-visible {
  color: #d1e8ff;
}

.shared-transcript-link-inert,
.shared-transcript-image-inert {
  color: #9ca3ad;
}

.shared-transcript-assets {
  display: grid;
  gap: 0.8rem;
  margin-top: 1rem;
}

.shared-transcript-asset {
  margin: 0;
}

.shared-transcript-asset img {
  display: block;
  max-width: 100%;
  height: auto;
  border: 1px solid #3a414a;
  border-radius: 0.6rem;
  background: #0d0f11;
}

.shared-transcript-asset-error {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  color: #ffb4a8;
  font-size: 0.86rem;
}

.shared-transcript-asset-error button {
  padding: 0.25rem 0.55rem;
  border: 1px solid #80564f;
  border-radius: 999px;
  background: #2c211f;
  color: #ffd3cb;
  cursor: pointer;
}

.shared-transcript-omission {
  margin: 0.5rem 0;
  padding: 0.65rem 0.9rem;
  border: 1px dashed #626a75;
  border-radius: 0.45rem;
  color: #aab1bb;
  font-size: 0.86rem;
  text-align: center;
}

.shared-transcript-work {
  margin-top: 1.15rem;
  border-top: 1px solid #30343a;
  color: #aab1bb;
  font-size: 0.86rem;
}

.shared-transcript-work summary {
  padding: 0.75rem 0;
  cursor: pointer;
  color: #aeb6c1;
  font-weight: 600;
}

.shared-transcript-work summary::marker {
  color: #748292;
}

.shared-transcript-work summary:hover,
.shared-transcript-work summary:focus-visible {
  color: #e1e6eb;
}

.shared-transcript-work summary:focus-visible {
  border-radius: 0.25rem;
  outline: 2px solid #5d9dd5;
  outline-offset: 3px;
}

.shared-transcript-work-list {
  display: grid;
  gap: 0.55rem;
  margin: 0 0 0.9rem;
  padding: 0;
  list-style: none;
}

.shared-transcript-work-list a {
  color: #8dc7ff;
  overflow-wrap: anywhere;
  text-underline-offset: 0.15em;
}

.shared-transcript-tool-call {
  padding: 0.65rem 0.75rem;
  border: 1px solid #2c3239;
  border-radius: 0.5rem;
  background: #171a1e;
}

.shared-transcript-tool-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
}

.shared-transcript-tool-name {
  padding: 0;
  background: transparent;
  color: #d7dde5;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.8rem;
  overflow-wrap: anywhere;
}

.shared-transcript-tool-status {
  flex: 0 0 auto;
  color: #89939f;
  font-size: 0.7rem;
}

.shared-transcript-tool-status-completed {
  color: #86b99a;
}

.shared-transcript-tool-status-failed {
  color: #ffb4a8;
}

.shared-transcript-tool-status-unknown {
  color: #d2b777;
}

.shared-transcript-tool-parameters {
  display: grid;
  gap: 0.28rem;
  margin: 0.5rem 0 0;
}

.shared-transcript-tool-parameters > div {
  display: grid;
  grid-template-columns: minmax(4rem, 6rem) minmax(0, 1fr);
  gap: 0.65rem;
}

.shared-transcript-tool-parameters dt {
  color: #747f8c;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.72rem;
}

.shared-transcript-tool-parameters dd {
  min-width: 0;
  margin: 0;
  color: #b9c1cb;
  overflow-wrap: anywhere;
}

.shared-transcript-page-placeholder {
  position: relative;
  min-height: 3rem;
  margin: 1rem 0;
  padding: 1rem;
  border: 1px dashed #4a515a;
  border-radius: 0.6rem;
  text-align: center;
}

.shared-transcript-page-placeholder button {
  position: sticky;
  top: 1rem;
  display: block;
  margin: 0 auto;
  padding: 0.45rem 0.7rem;
  border: 1px solid #59626d;
  border-radius: 0.4rem;
  background: #20252b;
  cursor: pointer;
}

.shared-transcript-page-feed {
  display: flex;
  justify-content: center;
  margin-top: 1.5rem;
  padding: 1rem 0;
}

.shared-transcript-page-feed button {
  min-width: 12rem;
  padding: 0.65rem 1rem;
  border: 1px solid #59626d;
  border-radius: 999px;
  background: #20252b;
  color: #dce1e7;
  cursor: pointer;
}

.shared-transcript-page-feed button:hover:not(:disabled),
.shared-transcript-page-feed button:focus-visible {
  border-color: #8793a0;
  background: #292f36;
}

.shared-transcript-page-feed button:disabled {
  color: #87909b;
  cursor: wait;
}

.shared-transcript-failure {
  width: min(100% - 2rem, 540px);
  margin: 0 auto;
  padding: 20vh 0 3rem;
  text-align: center;
}

.shared-transcript-failure h1 {
  margin: 0;
  color: #f4f5f6;
  font-size: clamp(1.7rem, 4vw, 2.4rem);
}

.shared-transcript-failure p {
  color: #9ca5b0;
}

.shared-transcript-footer {
  margin-top: 3rem;
  padding-top: 1.15rem;
  border-top: 1px solid #242a31;
  color: #7d8793;
  font-size: 0.72rem;
  line-height: 1.55;
  text-align: center;
  overflow-wrap: anywhere;
}

.shared-transcript-footer p {
  margin: 0.18rem auto;
}

.shared-transcript-footer-models {
  max-width: 720px;
}

.shared-transcript-footer-model {
  color: #929ca8;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

.shared-transcript-footer-credit {
  margin-top: 0.48rem !important;
  color: #69727d;
  letter-spacing: 0.04em;
}

@media (max-width: 600px) {
  .shared-transcript-reader {
    width: min(100% - 1.25rem, 780px);
    padding-top: 2rem;
  }

  .shared-transcript-message-user {
    padding: 1rem;
  }
}

</style>
</head>
